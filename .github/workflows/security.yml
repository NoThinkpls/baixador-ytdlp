name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/requirements-linux.txt
            requirements/requirements-security.txt
      - name: Auditar vulnerabilidades conhecidas
        run: |
          python -m pip install -r requirements/requirements-security.txt
          # Os locks cobrem também as dependências transitivas dos três sistemas.
          for requirements in requirements/requirements-windows.lock requirements/requirements-macos.lock requirements/requirements-linux.lock; do
            echo "::group::pip-audit $requirements"
            python -m pip_audit --disable-pip -r "$requirements" --no-deps || status=1
            echo "::endgroup::"
          done
          exit "${status:-0}"

  upstream-assets:
    # Avisa antes de quebrar: o nome dos assets de FFmpeg/Deno é escolhido em
    # runtime, mas se o fornecedor mudar o padrão, este job falha na segunda.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Conferir releases do BtbN e do Deno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from baixador_ytdlp.tools import (FFMPEG_RELEASE_API, DENO_RELEASES_API,
                                            pick_btbn_asset, pick_deno_release)
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          assets = get(FFMPEG_RELEASE_API)["assets"]
          for key in ("win64", "x86_64", "aarch64"):
              print(key, pick_btbn_asset(assets, key)["name"])
          print("deno", pick_deno_release(get(DENO_RELEASES_API))["tag_name"])
          PY

  locks-in-sync:
    # Dependabot atualiza os requirements*.txt, mas não os .lock: este job falha
    # quando um PR muda a entrada sem regenerar os locks (scripts/update_locks.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Conferir se os locks refletem os requirements
        run: |
          python -m pip install uv==0.11.7
          python - <<'PY'
          import re, subprocess, sys
          pairs = {"requirements.txt": "requirements/requirements-windows.lock",
                   "requirements/requirements-macos.txt": "requirements/requirements-macos.lock",
                   "requirements/requirements-linux.txt": "requirements/requirements-linux.lock"}
          failed = False
          for source, lock in pairs.items():
              wanted = {m.group(1).lower(): m.group(2) for m in
                        re.finditer(r"^([A-Za-z0-9_.-]+)==([^\s;]+)", open(source).read(), re.M)}
              locked = {m.group(1).lower(): m.group(2) for m in
                        re.finditer(r"^([a-z0-9_.-]+)==([^\s\\]+)", open(lock).read(), re.M)}
              for name, version in wanted.items():
                  if locked.get(name.replace("_", "-")) != version:
                      print(f"{lock}: {name} deveria ser {version}, está {locked.get(name)}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY

  workflow-lint:
    # Erros de sintaxe/expressão e problemas de segurança nos próprios workflows
    # (injeção via template, permissões largas, credenciais persistidas).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verificar os workflows
        run: |
          python -m pip install actionlint-py==1.7.12.25 zizmor==1.30.1
          actionlint .github/workflows/*.yml
          zizmor --offline .github/workflows
