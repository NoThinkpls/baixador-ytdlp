name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-linux.txt
            requirements-security.txt
      - name: Auditar vulnerabilidades conhecidas
        run: |
          python -m pip install -r requirements-security.txt
          # Os locks cobrem também as dependências transitivas dos três sistemas.
          for requirements in requirements-windows.lock requirements-macos.lock requirements-linux.lock; do
            echo "::group::pip-audit $requirements"
            python -m pip_audit --disable-pip -r "$requirements" --no-deps || status=1
            echo "::endgroup::"
          done
          exit ${status:-0}

  upstream-assets:
    # Avisa antes de quebrar: o nome dos assets de FFmpeg/Deno é escolhido em
    # runtime, mas se o fornecedor mudar o padrão, este job falha na segunda.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Conferir releases do BtbN e do Deno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from baixador_ytdlp.tools import (FFMPEG_RELEASE_API, DENO_RELEASES_API,
                                            pick_btbn_asset, pick_deno_release)
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          assets = get(FFMPEG_RELEASE_API)["assets"]
          for key in ("win64", "x86_64", "aarch64"):
              print(key, pick_btbn_asset(assets, key)["name"])
          print("deno", pick_deno_release(get(DENO_RELEASES_API))["tag_name"])
          PY

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3

  locks-in-sync:
    # Dependabot atualiza os requirements*.txt, mas não os .lock: este job falha
    # quando um PR muda a entrada sem regenerar os locks (scripts/update_locks.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Conferir se os locks refletem os requirements
        run: |
          python -m pip install uv==0.11.7
          python - <<'PY'
          import re, subprocess, sys
          pairs = {"requirements.txt": "requirements-windows.lock",
                   "requirements-macos.txt": "requirements-macos.lock",
                   "requirements-linux.txt": "requirements-linux.lock"}
          failed = False
          for source, lock in pairs.items():
              wanted = {m.group(1).lower(): m.group(2) for m in
                        re.finditer(r"^([A-Za-z0-9_.-]+)==([^\s;]+)", open(source).read(), re.M)}
              locked = {m.group(1).lower(): m.group(2) for m in
                        re.finditer(r"^([a-z0-9_.-]+)==([^\s\\]+)", open(lock).read(), re.M)}
              for name, version in wanted.items():
                  if locked.get(name.replace("_", "-")) != version:
                      print(f"{lock}: {name} deveria ser {version}, está {locked.get(name)}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY
