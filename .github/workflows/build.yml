name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    name: Compilar no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Locks com hashes: exatamente os mesmos pacotes em toda build.
          pip install --require-hashes -r requirements-windows.lock -r requirements-build-windows.lock
          # Sem PyTorch: o motor de transcrição é o CTranslate2, com runtime
          # CUDA (cuBLAS/cuDNN 8) incluído no instalador.

      - name: Executar testes de diagnóstico
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m unittest discover -s tests -v

      - name: Verificar a qualidade do código
        run: python -m ruff check .

      - name: Teste de fumaça da janela real (bordas e repintura)
        # O offscreen não tem DWM nem moldura; aqui a janela é composta de verdade.
        run: python scripts/window_smoke.py --screenshot window-smoke.png

      - name: Guardar a captura do teste de fumaça
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: window-smoke-${{ github.run_number }}
          path: window-smoke.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Inventário real do ambiente de build (SBOM e licenças)
        run: |
          # Ferramentas num venv separado: o inventário descreve só o que vai para
          # o instalador, sem pip-audit/cyclonedx misturados.
          $buildPython = (Get-Command python).Source
          python -m venv .sbom
          .sbom\Scripts\python -m pip install -r requirements-security.txt
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          .sbom\Scripts\python -m cyclonedx_py environment $buildPython --output-format JSON `
            --output-file dist\installer\sbom-windows.cdx.json
          python -m pip install pip-licenses==5.5.5
          python -m piplicenses --format=markdown --with-urls --with-license-file --no-license-path `
            --ignore-packages pip-licenses prettytable wcwidth --output-file THIRD_PARTY_LICENSES.md

      - name: Definir a versão
        id: ver
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/main' -or $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $v = python -c "import ast,pathlib; t=ast.parse(pathlib.Path('baixador_ytdlp/config.py').read_text(encoding='utf-8')); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))"
            if ($LASTEXITCODE -ne 0 -or -not $v) { throw "Não foi possível ler APP_VERSION" }
          } else {
            $v = "0.0.0-build$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Versão: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar com Nuitka
        run: |
          # Evita caminhos 8.3 da cache padrão de apps instalados pelo Windows.
          $env:NUITKA_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'baixador-ytdlp-nuitka-cache'
          # O nome do artefato em pull requests inclui o número da execução,
          # mas os recursos PE aceitam apenas uma versão numérica do app.
          $resourceVersion = python -c "import ast,pathlib; t=ast.parse(pathlib.Path('baixador_ytdlp/config.py').read_text(encoding='utf-8')); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))"
          if ($LASTEXITCODE -ne 0 -or -not $resourceVersion) { throw "Não foi possível ler APP_VERSION" }
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets\icon.ico `
            --file-version=$resourceVersion `
            --product-version=$resourceVersion `
            --file-description='Baixador YT-DLP' `
            --include-data-dir=assets=assets `
            --include-data-files=THIRD_PARTY_NOTICES.md=THIRD_PARTY_NOTICES.md `
            --user-package-configuration-file=nuitka-package.config.yml `
            --include-package=nvidia.cuda_runtime `
            --include-package=nvidia.cublas `
            --include-package=nvidia.cudnn `
            --include-package-data=faster_whisper `
            --include-package-data=ctranslate2 `
            --include-package-data=av `
            --include-package-data=onnxruntime `
            --include-package-data=tokenizers `
            --include-package-data=huggingface_hub `
            --include-distribution-metadata=faster-whisper `
            --include-distribution-metadata=ctranslate2 `
            --include-distribution-metadata=av `
            --include-distribution-metadata=onnxruntime `
            --include-distribution-metadata=tokenizers `
            --include-distribution-metadata=huggingface-hub `
            --include-distribution-metadata=nvidia-cuda-runtime-cu12 `
            --include-distribution-metadata=nvidia-cublas-cu12 `
            --include-distribution-metadata=nvidia-cudnn-cu12 `
            --output-dir=dist `
            --output-filename=baixador-ytdlp.exe `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka falhou com código $LASTEXITCODE" }

          $nuitkaBundle = 'dist\main.dist'
          $releaseBundle = 'dist\baixador-ytdlp'
          if (-not (Test-Path -LiteralPath $nuitkaBundle -PathType Container)) {
            throw "Nuitka não gerou $nuitkaBundle"
          }
          Move-Item -LiteralPath $nuitkaBundle -Destination $releaseBundle

      - name: Conferir o executável
        run: |
          $exe = 'dist\baixador-ytdlp\baixador-ytdlp.exe'
          if (-not (Test-Path $exe)) { throw "Nuitka não gerou $exe" }
          $requiredCudaDlls = @(
            'cudart64_12.dll', 'cublas64_12.dll', 'cublasLt64_12.dll',
            'cudnn64_8.dll', 'cudnn_ops_infer64_8.dll', 'cudnn_cnn_infer64_8.dll'
          )
          $missingCudaDlls = foreach ($dll in $requiredCudaDlls) {
            if (-not (Get-ChildItem -Path 'dist\baixador-ytdlp' -Filter $dll -File -Recurse)) { $dll }
          }
          if ($missingCudaDlls) { throw "DLLs CUDA ausentes: $($missingCudaDlls -join ', ')" }
          $fasterWhisperAssets = python -c "from pathlib import Path; from faster_whisper.utils import get_assets_path; root=Path(get_assets_path()); print('\n'.join(str(path.relative_to(root)) for path in root.rglob('*') if path.is_file() and path.suffix not in {'.py', '.pyc'} and '__pycache__' not in path.parts))"
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível listar os assets do faster-whisper" }
          $bundleAssets = Join-Path (Split-Path -Parent $exe) 'faster_whisper\assets'
          $missingRuntimeFiles = @($fasterWhisperAssets | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $bundleAssets $_) -PathType Leaf)
          })
          if ($missingRuntimeFiles) {
            throw "Dados do faster-whisper ausentes no bundle: $($missingRuntimeFiles -join ', ')"
          }
          $selfTestReport = Join-Path $env:TEMP 'baixador-self-test.json'
          & $exe '--self-test' $selfTestReport
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $selfTestReport -PathType Leaf)) {
            $details = if (Test-Path -LiteralPath $selfTestReport -PathType Leaf) {
              Get-Content -LiteralPath $selfTestReport -Raw
            } else {
              'O executável não produziu o relatório do self-test.'
            }
            throw "Smoke test do executável falhou: $details"
          }
          $item = Get-Item $exe
          Write-Host "OK: $($item.Name) — $([math]::Round($item.Length / 1MB, 1)) MB"

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado após instalar o Inno Setup" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou com código $LASTEXITCODE" }
          Get-ChildItem dist\installer

      - name: Empacotar a versão portátil
        run: |
          Set-Content -Path 'dist\baixador-ytdlp\portable.txt' -Value 'Dados mantidos nesta pasta.' -Encoding utf8
          $archive = "dist\installer\BaixadorYtdlp-${{ steps.ver.outputs.version }}-portable-windows.zip"
          Compress-Archive -Path 'dist\baixador-ytdlp\*' -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive -PathType Leaf)) { throw "Arquivo portátil não gerado: $archive" }

      - name: Criar cópias de download estável
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # Estes nomes são usados pelos botões do README:
          # /releases/latest/download/baixador-ytdlp-setup.exe
          # /releases/latest/download/baixador-ytdlp-portable-windows.zip
          $installer = Get-ChildItem dist\installer\BaixadorYtdlp-*-setup.exe | Select-Object -First 1
          $portable = Get-ChildItem dist\installer\BaixadorYtdlp-*-portable-windows.zip | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw "Pacotes Windows não encontrados para criar os aliases de download" }
          Copy-Item $installer.FullName dist\installer\baixador-ytdlp-setup.exe -Force
          Copy-Item $portable.FullName dist\installer\baixador-ytdlp-portable-windows.zip -Force

      - name: Validar referências públicas do README
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          $readme = Get-Content README.md -Raw
          $required = @(
            'baixador-ytdlp-setup.exe',
            'baixador-ytdlp-portable-windows.zip',
            'baixador-ytdlp-macos-arm64.dmg',
            'baixador-ytdlp-macos-arm64.zip',
            'baixador-ytdlp-linux-amd64.deb',
            'baixador-ytdlp-portable-linux-x86_64.tar.gz'
          )
          $missing = $required | Where-Object {
            $readme -notmatch [regex]::Escape("releases/latest/download/$_")
          }
          if ($missing) {
            throw "README sem os links de download estáveis: $($missing -join ', ')"
          }

      - name: Gerar os hashes
        run: |
          Set-Content -Path dist\installer\SHA256SUMS.txt -Value $null
          Get-ChildItem dist\installer -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Tee-Object -Append dist\installer\SHA256SUMS.txt
          }

      - name: Publicar a versão portátil
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baixador-ytdlp-portatil-${{ steps.ver.outputs.version }}
          path: dist/baixador-ytdlp
          retention-days: 30

      - name: Publicar o instalador
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baixador-ytdlp-setup-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/*.zip
            dist/installer/SHA256SUMS.txt
            dist/installer/sbom-windows.cdx.json
          retention-days: 30

  macos:
    name: Compilar no macOS Apple Silicon
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar o Python arm64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-macos.lock -r requirements-build-macos.lock
          python -m compileall -q baixador_ytdlp main.py

      - name: Inventário real do ambiente de build (SBOM)
        run: |
          build_python="$(command -v python)"
          python -m venv .sbom
          .sbom/bin/python -m pip install -r requirements-security.txt
          mkdir -p dist/installer
          .sbom/bin/python -m cyclonedx_py environment "$build_python" --output-format JSON \
            --output-file dist/installer/sbom-macos.cdx.json

      - name: Executar testes de diagnóstico
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

      - name: Definir a versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(python -c "import ast,pathlib; t=ast.parse(pathlib.Path('baixador_ytdlp/config.py').read_text(encoding='utf-8')); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))")"
            test -n "$version"
          else
            version="0.0.0-build${GITHUB_RUN_NUMBER}"
          fi
          echo "Versão: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Preparar o ícone macOS
        run: |
          iconset="build/baixador-ytdlp.iconset"
          rm -rf "$iconset"
          mkdir -p "$iconset"
          sips -z 16 16 assets/icon.png --out "$iconset/icon_16x16.png"
          sips -z 32 32 assets/icon.png --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 assets/icon.png --out "$iconset/icon_32x32.png"
          sips -z 64 64 assets/icon.png --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 assets/icon.png --out "$iconset/icon_128x128.png"
          sips -z 256 256 assets/icon.png --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 assets/icon.png --out "$iconset/icon_256x256.png"
          sips -z 512 512 assets/icon.png --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 assets/icon.png --out "$iconset/icon_512x512.png"
          sips -z 1024 1024 assets/icon.png --out "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o build/baixador-ytdlp.icns

      - name: Compilar o aplicativo .app
        run: |
          python -m PyInstaller main.py \
            --noconfirm --clean --windowed --name baixador-ytdlp \
            --osx-bundle-identifier com.nothinkpls.baixadorytdlp \
            --icon build/baixador-ytdlp.icns \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all certifi \
            --collect-all mlx \
            --hidden-import mlx_whisper \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module torchaudio \
            --exclude-module triton \
            --add-data "assets/icon.png:assets" \
            --add-data "THIRD_PARTY_NOTICES.md:."

      - name: Registrar o protocolo baixador:// no Info.plist
        run: |
          plist="dist/baixador-ytdlp.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.nothinkpls.baixador-ytdlp" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string baixador" "$plist"

      - name: Conferir o bundle Apple Silicon
        run: |
          app="dist/baixador-ytdlp.app"
          executable="$app/Contents/MacOS/baixador-ytdlp"
          test -d "$app"
          test -x "$executable"
          lipo -archs "$executable" | grep -qw arm64
          # A extensão MLX tem nomes internos diferentes entre versões. Usar
          # -quit evita que o find retorne erro de pipe ao primeiro resultado.
          mlx_file="$(find "$app" -type f -path '*mlx*' -print -quit)"
          test -n "$mlx_file"
          echo "OK: $app"

      - name: Empacotar o aplicativo
        run: |
          mkdir -p dist/installer
          app="dist/baixador-ytdlp.app"
          archive="dist/installer/BaixadorYtdlp-${{ steps.ver.outputs.version }}-macos-arm64.zip"
          dmg="dist/installer/BaixadorYtdlp-${{ steps.ver.outputs.version }}-macos-arm64.dmg"
          # O marcador fica AO LADO do .app: gravar dentro do pacote quebra a
          # assinatura e falha sob App Translocation (volume somente leitura).
          portable_root="build/portable/baixador-ytdlp-portable"
          rm -rf "build/portable"
          mkdir -p "$portable_root"
          cp -R "$app" "$portable_root/baixador-ytdlp.app"
          printf 'Mova esta pasta inteira para um local gravável antes de abrir.\n' \
            > "$portable_root/portable.txt"
          ditto -c -k --sequesterRsrc --keepParent "$portable_root" "$archive"

          # O DMG entrega o padrão esperado no macOS: abrir e arrastar o app para Aplicativos.
          staging="build/dmg-root"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "$app" "$staging/baixador-ytdlp.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Baixador YT-DLP" -srcfolder "$staging" -ov -format UDZO "$dmg"
          # No macOS hospedado, o diskimages-helper pode ainda manter o DMG
          # ocupado por alguns segundos depois do `create`. Repetir a checagem
          # evita falhar uma release válida por esse estado transitório.
          for attempt in {1..5}; do
            if hdiutil verify "$dmg"; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "::error::Não foi possível validar o DMG após 5 tentativas."
              exit 1
            fi
            sleep 3
          done

          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            cp "$archive" dist/installer/baixador-ytdlp-macos-arm64.zip
            cp "$dmg" dist/installer/baixador-ytdlp-macos-arm64.dmg
          fi
          shasum -a 256 dist/installer/*.dmg dist/installer/*.zip > dist/installer/SHA256SUMS-macos.txt

      - name: Publicar o aplicativo macOS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baixador-ytdlp-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.dmg
            dist/installer/*.zip
            dist/installer/SHA256SUMS-macos.txt
            dist/installer/sbom-macos.cdx.json
          retention-days: 30

  linux:
    name: Compilar no Linux (Ubuntu/Debian)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar bibliotecas gráficas do Linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Preparar o Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-linux.lock -r requirements-build-linux.lock
          python -m compileall -q baixador_ytdlp main.py

      - name: Inventário real do ambiente de build (SBOM)
        run: |
          build_python="$(command -v python)"
          python -m venv .sbom
          .sbom/bin/python -m pip install -r requirements-security.txt
          mkdir -p dist/installer
          .sbom/bin/python -m cyclonedx_py environment "$build_python" --output-format JSON \
            --output-file dist/installer/sbom-linux.cdx.json

      - name: Executar testes de diagnóstico
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

      - name: Definir a versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(python -c "import ast,pathlib; t=ast.parse(pathlib.Path('baixador_ytdlp/config.py').read_text(encoding='utf-8')); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))")"
            test -n "$version"
          else
            version="0.0.0-build${GITHUB_RUN_NUMBER}"
          fi
          echo "Versão: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compilar com PyInstaller
        run: |
          python -m PyInstaller main.py \
            --noconfirm --clean --windowed --name baixador-ytdlp \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module torchaudio \
            --exclude-module triton \
            --add-data "assets/icon.png:assets" \
            --add-data "THIRD_PARTY_NOTICES.md:."

      - name: Conferir o aplicativo Linux
        run: |
          executable="dist/baixador-ytdlp/baixador-ytdlp"
          test -x "$executable"
          test -d "dist/baixador-ytdlp/_internal"
          echo "OK: $executable (bundle validado)"

      - name: Empacotar .deb e versão portátil
        run: |
          version="${{ steps.ver.outputs.version }}"
          root="build/linux-package"
          out="dist/installer"
          rm -rf "$root"
          mkdir -p "$root/DEBIAN" "$root/opt/baixador-ytdlp" "$root/usr/bin" "$out"
          cp -a dist/baixador-ytdlp/. "$root/opt/baixador-ytdlp/"
          install -Dm644 packaging/linux/control.in "$root/DEBIAN/control"
          sed -i "s/@VERSION@/$version/g" "$root/DEBIAN/control"
          install -Dm644 packaging/linux/baixador-ytdlp.desktop \
            "$root/usr/share/applications/baixador-ytdlp.desktop"
          install -Dm644 assets/icon.png \
            "$root/usr/share/icons/hicolor/256x256/apps/baixador-ytdlp.png"
          ln -s /opt/baixador-ytdlp/baixador-ytdlp "$root/usr/bin/baixador-ytdlp"

          deb="$out/BaixadorYtdlp-${version}-linux-amd64.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          test -f "$deb"

          printf 'Dados mantidos nesta pasta.\n' > dist/baixador-ytdlp/portable.txt
          portable="$out/BaixadorYtdlp-${version}-portable-linux-x86_64.tar.gz"
          tar --create --gzip --file "$portable" --directory dist baixador-ytdlp
          test -f "$portable"

          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            cp "$deb" "$out/baixador-ytdlp-linux-amd64.deb"
            cp "$portable" "$out/baixador-ytdlp-portable-linux-x86_64.tar.gz"
          fi
          sha256sum "$out"/*.deb "$out"/*.tar.gz > "$out/SHA256SUMS-linux.txt"

      - name: Publicar os pacotes Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baixador-ytdlp-linux-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.deb
            dist/installer/*.tar.gz
            dist/installer/SHA256SUMS-linux.txt
            dist/installer/sbom-linux.cdx.json
          retention-days: 30

  release:
    name: Publicar release
    needs: [windows, macos, linux]
    # Um push em main ou uma tag válida só publica depois que todos os
    # pacotes foram validados, evitando uma Release sem downloads.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Ambiente protegido: configure "Required reviewers" em Settings → Environments
    # para que o segredo de assinatura só seja liberado com aprovação manual.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decidir a publicação automática
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c "import ast,pathlib; t=ast.parse(pathlib.Path('baixador_ytdlp/config.py').read_text(encoding='utf-8')); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))")"
          test -n "$version"
          tag="v${version}"
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/*)
              if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
                echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão $version."
                exit 1
              fi
              ;;
            *)
              echo "::error::Referência não publicável: $GITHUB_REF."
              exit 1
              ;;
          esac
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          case "$status" in
            200) assets="$(jq '.assets | length' "$response")" ;;
            404) assets=0 ;;
            *)
              cat "$response"
              echo "::error::Não foi possível consultar a release $tag (HTTP $status)."
              exit 1
              ;;
          esac
          publish=false
          if [[ "$status" == 404 || "$assets" == 0 ]]; then
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release $tag: HTTP $status, $assets ativo(s), publicar=$publish"

      - name: Baixar os instaladores compilados
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: baixador-ytdlp-*
          path: release-assets
          merge-multiple: true

      - name: Preparar a geração do SBOM
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Gerar inventário CycloneDX das dependências
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          python -m pip install -r requirements-security.txt
          # Os jobs de build já trazem o SBOM do ambiente real; os requisitos
          # declarados só servem de reserva se algum artefato faltar.
          test -f release-assets/sbom-windows.cdx.json || python -m cyclonedx_py requirements \
            requirements.txt --output-format JSON --output-file release-assets/sbom-windows.cdx.json
          test -f release-assets/sbom-macos.cdx.json || python -m cyclonedx_py requirements \
            requirements-macos.txt --output-format JSON --output-file release-assets/sbom-macos.cdx.json
          test -f release-assets/sbom-linux.cdx.json || python -m cyclonedx_py requirements \
            requirements-linux.txt --output-format JSON --output-file release-assets/sbom-linux.cdx.json

      - name: Validar os ativos da Release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          required=(
            "BaixadorYtdlp-${version}-setup.exe"
            "baixador-ytdlp-setup.exe"
            "BaixadorYtdlp-${version}-portable-windows.zip"
            "baixador-ytdlp-portable-windows.zip"
            "BaixadorYtdlp-${version}-macos-arm64.dmg"
            "baixador-ytdlp-macos-arm64.dmg"
            "BaixadorYtdlp-${version}-macos-arm64.zip"
            "baixador-ytdlp-macos-arm64.zip"
            "BaixadorYtdlp-${version}-linux-amd64.deb"
            "baixador-ytdlp-linux-amd64.deb"
            "BaixadorYtdlp-${version}-portable-linux-x86_64.tar.gz"
            "baixador-ytdlp-portable-linux-x86_64.tar.gz"
            "SHA256SUMS.txt"
            "SHA256SUMS-macos.txt"
            "SHA256SUMS-linux.txt"
            "sbom-windows.cdx.json"
            "sbom-macos.cdx.json"
            "sbom-linux.cdx.json"
          )
          for asset in "${required[@]}"; do
            test -f "release-assets/$asset" || {
              echo "::error::Arquivo obrigatório não encontrado: $asset"
              exit 1
            }
          done

      - name: Assinar o SHA256SUMS.txt (Ed25519)
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # O atualizador do app confere esta assinatura com a chave pública
          # embutida. Sem o segredo configurado, a release sai sem .sig — e,
          # quando RELEASE_PUBLIC_KEYS estiver preenchida, o app a recusará.
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            if python -c "from baixador_ytdlp.updater import RELEASE_PUBLIC_KEYS as k; raise SystemExit(0 if k else 1)"; then
              echo "::error::O app exige releases assinadas, mas RELEASE_SIGNING_KEY não está configurado."
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY ausente; release publicada sem assinatura."
            exit 0
          fi
          python scripts/release_signing.py sign release-assets/SHA256SUMS.txt
          if python -c "from baixador_ytdlp.updater import RELEASE_PUBLIC_KEYS as k; raise SystemExit(0 if k else 1)"; then
            python scripts/release_signing.py verify release-assets/SHA256SUMS.txt || {
              echo "::error::A chave privada não corresponde a RELEASE_PUBLIC_KEYS."; exit 1; }
          fi

      - name: Atestar a proveniência dos instaladores
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Criar a release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: baixador-ytdlp ${{ steps.release.outputs.tag }}
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/SHA256SUMS*.txt
            release-assets/SHA256SUMS.txt.sig
            release-assets/*.cdx.json
          generate_release_notes: true
          make_latest: true
