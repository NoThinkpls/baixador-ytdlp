name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    name: Compilar no Windows
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Sem PyTorch: o motor de transcrição é o CTranslate2, com runtime
          # CUDA (cuBLAS/cuDNN 8) incluído no instalador.

      - name: Definir a versão
        id: ver
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = "0.0.0-build$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Versão: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar com PyInstaller
        run: pyinstaller baixador_ytdlp.spec --noconfirm

      - name: Conferir o executável
        run: |
          $exe = 'dist\baixador-ytdlp\baixador-ytdlp.exe'
          if (-not (Test-Path $exe)) { throw "PyInstaller não gerou $exe" }
          $requiredCudaDlls = @(
            'cudart64_12.dll', 'cublas64_12.dll', 'cublasLt64_12.dll',
            'cudnn64_8.dll', 'cudnn_ops_infer64_8.dll', 'cudnn_cnn_infer64_8.dll'
          )
          $missingCudaDlls = foreach ($dll in $requiredCudaDlls) {
            if (-not (Get-ChildItem -Path 'dist\baixador-ytdlp' -Filter $dll -File -Recurse)) { $dll }
          }
          if ($missingCudaDlls) { throw "DLLs CUDA ausentes: $($missingCudaDlls -join ', ')" }
          $item = Get-Item $exe
          Write-Host "OK: $($item.Name) — $([math]::Round($item.Length / 1MB, 1)) MB"

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar o instalador
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado após instalar o Inno Setup" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou com código $LASTEXITCODE" }
          Get-ChildItem dist\installer

      - name: Empacotar a versão portátil
        run: |
          $archive = "dist\installer\BaixadorYtdlp-${{ steps.ver.outputs.version }}-portable-windows.zip"
          Compress-Archive -Path 'dist\baixador-ytdlp\*' -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive -PathType Leaf)) { throw "Arquivo portátil não gerado: $archive" }

      - name: Criar cópias de download estável
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Estes nomes são usados pelos botões do README:
          # /releases/latest/download/baixador-ytdlp-setup.exe
          # /releases/latest/download/baixador-ytdlp-portable-windows.zip
          $installer = Get-ChildItem dist\installer\BaixadorYtdlp-*-setup.exe | Select-Object -First 1
          $portable = Get-ChildItem dist\installer\BaixadorYtdlp-*-portable-windows.zip | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw "Pacotes Windows não encontrados para criar os aliases de download" }
          Copy-Item $installer.FullName dist\installer\baixador-ytdlp-setup.exe -Force
          Copy-Item $portable.FullName dist\installer\baixador-ytdlp-portable-windows.zip -Force

      - name: Validar referências públicas do README
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $readme = Get-Content README.md -Raw
          $required = @(
            'baixador-ytdlp-setup.exe',
            'baixador-ytdlp-portable-windows.zip',
            'baixador-ytdlp-macos-arm64.dmg',
            'baixador-ytdlp-macos-arm64.zip'
          )
          $missing = $required | Where-Object {
            $readme -notmatch [regex]::Escape("releases/latest/download/$_")
          }
          if ($missing) {
            throw "README sem os links de download estáveis: $($missing -join ', ')"
          }

      - name: Gerar os hashes
        run: |
          Set-Content -Path dist\installer\SHA256SUMS.txt -Value $null
          Get-ChildItem dist\installer -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Tee-Object -Append dist\installer\SHA256SUMS.txt
          }

      - name: Publicar a versão portátil
        uses: actions/upload-artifact@v4
        with:
          name: baixador-ytdlp-portatil-${{ steps.ver.outputs.version }}
          path: dist/baixador-ytdlp
          retention-days: 30

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: baixador-ytdlp-setup-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/*.zip
            dist/installer/SHA256SUMS.txt
          retention-days: 30

  macos:
    name: Compilar no macOS Apple Silicon
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python arm64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-macos.txt pyinstaller
          python -m compileall -q baixador_ytdlp main.py

      - name: Definir a versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-build${GITHUB_RUN_NUMBER}"
          fi
          echo "Versão: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Preparar o ícone macOS
        run: |
          iconset="build/baixador-ytdlp.iconset"
          rm -rf "$iconset"
          mkdir -p "$iconset"
          sips -z 16 16 assets/icon.png --out "$iconset/icon_16x16.png"
          sips -z 32 32 assets/icon.png --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 assets/icon.png --out "$iconset/icon_32x32.png"
          sips -z 64 64 assets/icon.png --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 assets/icon.png --out "$iconset/icon_128x128.png"
          sips -z 256 256 assets/icon.png --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 assets/icon.png --out "$iconset/icon_256x256.png"
          sips -z 512 512 assets/icon.png --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 assets/icon.png --out "$iconset/icon_512x512.png"
          sips -z 1024 1024 assets/icon.png --out "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o build/baixador-ytdlp.icns

      - name: Compilar o aplicativo .app
        run: |
          python -m PyInstaller main.py \
            --noconfirm --clean --windowed --name baixador-ytdlp \
            --osx-bundle-identifier com.nothinkpls.baixadorytdlp \
            --icon build/baixador-ytdlp.icns \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all av \
            --collect-all pip \
            --collect-all mlx \
            --hidden-import mlx_whisper \
            --exclude-module torch \
            --exclude-module torchvision \
            --exclude-module torchaudio \
            --exclude-module triton \
            --add-data "assets/icon.png:assets"

      - name: Conferir o bundle Apple Silicon
        run: |
          app="dist/baixador-ytdlp.app"
          executable="$app/Contents/MacOS/baixador-ytdlp"
          test -d "$app"
          test -x "$executable"
          lipo -archs "$executable" | grep -qw arm64
          # A extensão MLX tem nomes internos diferentes entre versões. Usar
          # -quit evita que o find retorne erro de pipe ao primeiro resultado.
          mlx_file="$(find "$app" -type f -path '*mlx*' -print -quit)"
          test -n "$mlx_file"
          echo "OK: $app"

      - name: Empacotar o aplicativo
        run: |
          mkdir -p dist/installer
          app="dist/baixador-ytdlp.app"
          archive="dist/installer/BaixadorYtdlp-${{ steps.ver.outputs.version }}-macos-arm64.zip"
          dmg="dist/installer/BaixadorYtdlp-${{ steps.ver.outputs.version }}-macos-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"

          # O DMG entrega o padrão esperado no macOS: abrir e arrastar o app para Aplicativos.
          staging="build/dmg-root"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "$app" "$staging/baixador-ytdlp.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Baixador YT-DLP" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp "$archive" dist/installer/baixador-ytdlp-macos-arm64.zip
            cp "$dmg" dist/installer/baixador-ytdlp-macos-arm64.dmg
          fi
          shasum -a 256 dist/installer/*.dmg dist/installer/*.zip > dist/installer/SHA256SUMS-macos.txt

      - name: Publicar o aplicativo macOS
        uses: actions/upload-artifact@v4
        with:
          name: baixador-ytdlp-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.dmg
            dist/installer/*.zip
            dist/installer/SHA256SUMS-macos.txt
          retention-days: 30

  release:
    name: Publicar release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar os instaladores compilados
        uses: actions/download-artifact@v4
        with:
          pattern: baixador-ytdlp-*
          path: release-assets
          merge-multiple: true

      - name: Validar os ativos da Release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          required=(
            "BaixadorYtdlp-${version}-setup.exe"
            "baixador-ytdlp-setup.exe"
            "BaixadorYtdlp-${version}-portable-windows.zip"
            "baixador-ytdlp-portable-windows.zip"
            "BaixadorYtdlp-${version}-macos-arm64.dmg"
            "baixador-ytdlp-macos-arm64.dmg"
            "BaixadorYtdlp-${version}-macos-arm64.zip"
            "baixador-ytdlp-macos-arm64.zip"
            "SHA256SUMS.txt"
            "SHA256SUMS-macos.txt"
          )
          for asset in "${required[@]}"; do
            test -f "release-assets/$asset" || {
              echo "::error::Arquivo obrigatório não encontrado: $asset"
              exit 1
            }
          done

      - name: Criar a release
        uses: softprops/action-gh-release@v2
        with:
          name: baixador-ytdlp ${{ github.ref_name }}
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/SHA256SUMS*.txt
          generate_release_notes: true
