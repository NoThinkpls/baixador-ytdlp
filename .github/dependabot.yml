version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # O wheel do CTranslate2 traz o cudnn64_9.dll de uma versão exata; o
      # pacote nvidia-cudnn-cu12 precisa ser dessa mesma versão. Nenhuma das
      # peças sobe sozinha: a troca é manual e validada com o autoteste da
      # build numa máquina com GPU NVIDIA (ver CONTRIBUTING.md).
      - dependency-name: ctranslate2
      # Atualizados à mão, com o lock regenerado e o autoteste em GPU/Apple Silicon: o
      # Dependabot não regenera os .lock e o Qt/MLX/faster-whisper mudam o app inteiro.
      - dependency-name: faster-whisper
      - dependency-name: pyside6*
      - dependency-name: shiboken6
      - dependency-name: mlx*
      - dependency-name: torch
      - dependency-name: huggingface-hub
      - dependency-name: setuptools
      - dependency-name: send2trash
      # (o CTranslate2 usa pkg_resources; torch/huggingface-hub andam com o motor de transcrição)
      - dependency-name: nvidia-cudnn-cu12
      - dependency-name: nvidia-cublas-cu12
      - dependency-name: nvidia-cuda-runtime-cu12
    groups:
      whisper-cuda:
        patterns: ["ctranslate2", "faster-whisper", "nvidia-*"]
      qt:
        patterns: ["PySide6*", "shiboken6", "PySideSix-Frameless-Window"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
